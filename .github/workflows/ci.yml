name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
  push:
    branches:
      - master
      - next
  merge_group:

permissions: {}

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-typecheck-${{ matrix.node-version }}-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Types resolve through package exports to dist; build first.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 45
    concurrency:
      group: ${{ github.workflow }}-test-${{ matrix.node-version }}-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Rebuild native bindings for matrix node
        run: pnpm -r rebuild better-sqlite3

      # Build then tests (fail-closed). Use test:only because build already ran.
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test:only

      - name: Postgres-gated tests
        run: bash scripts/test-with-postgres.sh

      - name: Import smoke
        run: pnpm smoke:import

      - name: Pack smoke
        run: pnpm smoke:pack

  terraform:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      - name: Verify Terraform profile
        run: bash scripts/verify-terraform.sh

  sdk-conformance:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'

      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.22.0'
          check-latest: false

      - name: Install Python SDK
        working-directory: sdks/python
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Test Python SDK conformance
        working-directory: sdks/python
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Test Go SDK conformance
        working-directory: sdks/go
        run: go test ./...

      - name: Install Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal --no-self-update

      - name: Test Rust SDK unit suite
        working-directory: sdks/rust
        run: cargo +1.85.0 test --lib

      - name: Test Rust SDK documentation suite
        working-directory: sdks/rust
        run: cargo +1.85.0 test --doc

  ci:
    runs-on: ubuntu-latest
    needs: [typecheck, test, terraform, sdk-conformance]
    if: always()
    steps:
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
