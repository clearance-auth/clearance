# Build, verify, publish, and sign the actual Clearance release assets.
name: Clearance release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Clearance release version"
        required: true
        type: string
      recover_published_npm:
        description: "Recover signed assets after npm published but release attachment failed"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -Eeuo pipefail
          VERSION="${REQUESTED_VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+\.)*[0-9A-Za-z-]+)?(\+([0-9A-Za-z-]+\.)*[0-9A-Za-z-]+)?$ ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "::error::Release version must be exact SemVer: $VERSION"
            exit 1
          else
            echo "Skipping non-release tag: $REQUESTED_VERSION"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  candidate:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/tags/v${{ needs.gate.outputs.version }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Rebuild native bindings for matrix node
        run: pnpm -r rebuild better-sqlite3

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test:only

      - name: Postgres-gated tests
        run: bash scripts/test-with-postgres.sh

      - name: Import smoke
        run: pnpm smoke:import

      - name: Pack smoke
        run: pnpm smoke:pack

  sdk-conformance:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/v${{ needs.gate.outputs.version }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.22.0'
          check-latest: false
          cache: false

      - name: Install Python SDK
        working-directory: sdks/python
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Test Python SDK conformance
        working-directory: sdks/python
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Test Go SDK conformance
        working-directory: sdks/go
        run: go test ./...

      - name: Install Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal --no-self-update

      - name: Test Rust SDK unit suite
        working-directory: sdks/rust
        run: cargo +1.85.0 test --lib

      - name: Test Rust SDK documentation suite
        working-directory: sdks/rust
        run: cargo +1.85.0 test --doc

  release:
    needs: [gate, candidate, sdk-conformance]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: npm-release
    env:
      RECOVER_PUBLISHED_NPM: ${{ inputs.recover_published_npm && '1' || '0' }}
    concurrency:
      group: clearance-release-v${{ needs.gate.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/tags/v${{ needs.gate.outputs.version }}

      - name: Checkout npm recovery verifier
        if: inputs.recover_published_npm
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: .release-tooling
          sparse-checkout: |
            scripts/release-packages.mjs
            scripts/verify-npm-provenance.mjs

      # Cross-platform builds require emulation on the hosted amd64 runner; keep
      # Buildx itself native and fail the release if either target cannot build.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Provision integrity-pinned npm CLI
        env:
          NPM_CLI_VERSION: 11.16.0
          NPM_CLI_INTEGRITY: sha512-A74XL8OxmcegZDMWPkWb5bEQppg8HdYwW3rBD2sPoS4UQHVajfaxBkqyzLeJ3wR0kZ+5xoTjItxXaF7eIXUsyw==
        run: |
          set -Eeuo pipefail
          NPM_CLI_ARCHIVE="$RUNNER_TEMP/npm-cli-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tgz"
          NPM_CLI_DIR="$RUNNER_TEMP/npm-cli-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$NPM_CLI_DIR"
          curl --fail --silent --show-error --location \
            "https://registry.npmjs.org/npm/-/npm-${NPM_CLI_VERSION}.tgz" \
            --output "$NPM_CLI_ARCHIVE"
          ACTUAL_INTEGRITY="sha512-$(openssl dgst -sha512 -binary "$NPM_CLI_ARCHIVE" | openssl base64 -A)"
          [[ "$ACTUAL_INTEGRITY" == "$NPM_CLI_INTEGRITY" ]] || {
            echo "::error::npm CLI archive integrity does not match the pinned SHA-512"
            exit 1
          }
          tar -xzf "$NPM_CLI_ARCHIVE" -C "$NPM_CLI_DIR"
          test "$(node "$NPM_CLI_DIR/package/bin/npm-cli.js" --version)" = "$NPM_CLI_VERSION"
          echo "CLEARANCE_NPM_CLI=$NPM_CLI_DIR/package/bin/npm-cli.js" >> "$GITHUB_ENV"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Resolve version and require release signing identity
        env:
          REQUESTED_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -Eeuo pipefail
          VERSION="${REQUESTED_VERSION#v}"
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+\.)*[0-9A-Za-z-]+)?(\+([0-9A-Za-z-]+\.)*[0-9A-Za-z-]+)?$ ]] || {
            echo "::error::Release version must be exact SemVer: $VERSION"
            exit 1
          }
          test "$(git rev-parse --is-shallow-repository)" = "false" || {
            echo "::error::Release checkout must contain full history"
            exit 1
          }
          test "$(git rev-parse "refs/tags/v${VERSION}^{commit}")" = "$(git rev-parse HEAD)" || {
            echo "::error::Tag v${VERSION} must exist and resolve to the release commit"
            exit 1
          }
          [[ "$GITHUB_REPOSITORY" == "clearance-auth/clearance" ]] || {
            echo "::error::Releases must run in the canonical clearance-auth/clearance repository"
            exit 1
          }
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$RECOVER_PUBLISHED_NPM" != "1" ]]; then
            echo "::error::Explicit dispatch is recovery-only; first publication requires a release tag"
            exit 1
          fi
          if [[ "$RECOVER_PUBLISHED_NPM" == "1" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/master" \
              && "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/release-sign.yml@refs/heads/master" \
              && "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" ]] || {
              echo "::error::npm recovery must use the release workflow from the current master commit"
              exit 1
            }
          else
            [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/tags/v${VERSION}" ]] || {
              echo "::error::First publication requires the matching release-tag push"
              exit 1
            }
            bash scripts/verify-release-tag-authority.sh
          fi
          COSIGN_IDENTITY="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-sign.yml@refs/tags/v${VERSION}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "COSIGN_IDENTITY=$COSIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/clearance:$VERSION" >> "$GITHUB_ENV"
          echo "BACKUP_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/clearance-backup:$VERSION" >> "$GITHUB_ENV"
          echo "STAGING_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/clearance:staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "STAGING_BACKUP_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/clearance-backup:staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Install and verify from clean source
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter @clearance/e2e exec playwright install chromium
          node scripts/verify-release-version.mjs "$VERSION"
          pnpm verify:real

      - name: Rehearse release assembly
        run: pnpm release:rehearse -- "$VERSION"

      - name: Verify recovery npm packages before signing assets
        if: env.RECOVER_PUBLISHED_NPM == '1'
        run: |
          set -Eeuo pipefail
          test "$(node "$CLEARANCE_NPM_CLI" --version)" = "11.16.0"
          test "$(node "$CLEARANCE_NPM_CLI" config get registry)" = "https://registry.npmjs.org/"
          mapfile -t PACKAGES < <(node .release-tooling/scripts/release-packages.mjs names)
          integrity_for() {
            node -e '
              const fs=require("fs"), crypto=require("crypto");
              process.stdout.write("sha512-"+crypto.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"));
            ' "$1"
          }
          tarball_for() {
            node -e '
              const fs=require("fs"), cp=require("child_process"), path=require("path");
              const dir=process.argv[1], wanted=process.argv[2];
              const found=fs.readdirSync(dir).filter(f=>f.endsWith(".tgz")).find(f=>{
                try { const p=JSON.parse(cp.execFileSync("tar",["-xzf",path.join(dir,f),"-O","package/package.json"],{encoding:"utf8",stdio:["ignore","pipe","ignore"]})); return p.name===wanted; } catch { return false; }
              });
              if (!found) process.exit(1); process.stdout.write(path.join(dir,found));
            ' dist-release/assets "$1"
          }
          registry_integrity() {
            local package="$1" integrity=""
            for ATTEMPT in {1..120}; do
              if integrity="$(node "$CLEARANCE_NPM_CLI" view "${package}@${VERSION}" dist.integrity --json 2>/dev/null | tr -d '"\n')" \
                && [[ -n "$integrity" ]]; then
                printf '%s' "$integrity"
                return 0
              fi
              echo "Waiting for ${package}@${VERSION} to become readable from the public registry (${ATTEMPT}/120)..." >&2
              sleep 5
            done
            echo "::error::${package}@${VERSION} did not become readable from the public registry" >&2
            return 1
          }
          prepare_audit_tree() {
            local audit_dir="$1" package target
            shift
            mkdir -p "$audit_dir/node_modules"
            node -e '
              const fs = require("fs");
              const [output, version, ...packages] = process.argv.slice(1);
              const dependencies = Object.fromEntries(packages.map(name => [name, version]));
              fs.writeFileSync(output, `${JSON.stringify({ name: "clearance-provenance-audit", private: true, version: "0.0.0", dependencies }, null, 2)}\n`);
            ' "$audit_dir/package.json" "$VERSION" "$@"
            for package in "$@"; do
              target="$audit_dir/node_modules/$package"
              mkdir -p "$target"
              tar -xzf "$(tarball_for "$package")" -C "$target" --strip-components=1
            done
          }
          verify_provenance() {
            local output="$1"
            shift
            for ATTEMPT in {1..120}; do
              AUDIT_DIR="$(mktemp -d)"
              prepare_audit_tree "$AUDIT_DIR" "$@"
              if node "$CLEARANCE_NPM_CLI" audit signatures --prefix "$AUDIT_DIR" --json --include-attestations > "$AUDIT_DIR/npm-audit-signatures.json" \
                && node .release-tooling/scripts/verify-npm-provenance.mjs \
                  "$VERSION" "$SOURCE_COMMIT" "$AUDIT_DIR/npm-audit-signatures.json" \
                  dist-release/assets "$output" "$@"; then
                return 0
              fi
              echo "Waiting for signed provenance for ${*} (${ATTEMPT}/120)..." >&2
              sleep 5
            done
            echo "::error::Signed npm provenance did not become verifiable within ten minutes" >&2
            return 1
          }
          for PACKAGE in "${PACKAGES[@]}"; do
            EXPECTED_INTEGRITY="$(integrity_for "$(tarball_for "$PACKAGE")")"
            ACTUAL_INTEGRITY="$(registry_integrity "$PACKAGE")"
            [[ "$ACTUAL_INTEGRITY" == "$EXPECTED_INTEGRITY" ]] || {
              echo "::error::${PACKAGE}@${VERSION} registry SHA-512 does not match the frozen local tarball"
              exit 1
            }
          done
          verify_provenance dist-release/assets/npm-provenance.json "${PACKAGES[@]}"

      - name: Build and push staging container references
        if: env.RECOVER_PUBLISHED_NPM != '1'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx build --platform linux/amd64,linux/arm64 --push --tag "$STAGING_IMAGE" \
            --provenance=mode=max --sbom=true \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$SOURCE_COMMIT" \
            --metadata-file dist-release/image-metadata.json .
          DIGEST="$(node -e "const j=require('./dist-release/image-metadata.json'); process.stdout.write(j['containerimage.digest']||'')")"
          test -n "$DIGEST"
          printf '%s@%s\n' "${IMAGE%:*}" "$DIGEST" > dist-release/assets/container-image.txt
          docker buildx build --platform linux/amd64,linux/arm64 --push --target backup-runtime --tag "$STAGING_BACKUP_IMAGE" \
            --provenance=mode=max --sbom=true \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$SOURCE_COMMIT" \
            --metadata-file dist-release/backup-image-metadata.json .
          BACKUP_DIGEST="$(node -e "const j=require('./dist-release/backup-image-metadata.json'); process.stdout.write(j['containerimage.digest']||'')")"
          test -n "$BACKUP_DIGEST"
          printf '%s@%s\n' "${BACKUP_IMAGE%:*}" "$BACKUP_DIGEST" > dist-release/assets/backup-container-image.txt
          echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"
          echo "BACKUP_DIGEST=$BACKUP_DIGEST" >> "$GITHUB_ENV"

      - name: Recover existing tag-signed container digests
        if: env.RECOVER_PUBLISHED_NPM == '1'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          recover_digest() {
            local image="$1" evidence="$2" digest
            docker pull "$image" >/dev/null
            digest="$(docker image inspect "$image" --format '{{range .RepoDigests}}{{println .}}{{end}}' \
              | awk -F@ -v repository="${image%:*}" '$1 == repository { print $2; exit }')"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "::error::$image did not resolve to an immutable digest"
              exit 1
            }
            printf '%s@%s\n' "${image%:*}" "$digest" > "$evidence"
            printf '%s' "$digest"
          }
          DIGEST="$(recover_digest "$IMAGE" dist-release/assets/container-image.txt)"
          BACKUP_DIGEST="$(recover_digest "$BACKUP_IMAGE" dist-release/assets/backup-container-image.txt)"
          echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"
          echo "BACKUP_DIGEST=$BACKUP_DIGEST" >> "$GITHUB_ENV"

      - name: Verify recovered immutable container signatures
        if: env.RECOVER_PUBLISHED_NPM == '1'
        run: |
          set -Eeuo pipefail
          cosign verify --certificate-identity "$COSIGN_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE%:*}@${DIGEST}" >/dev/null
          cosign verify --certificate-identity "$COSIGN_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${BACKUP_IMAGE%:*}@${BACKUP_DIGEST}" >/dev/null

      - name: Keyless-sign and verify immutable container digests
        if: env.RECOVER_PUBLISHED_NPM != '1'
        run: |
          set -Eeuo pipefail
          PRIMARY_REF="${IMAGE%:*}@${DIGEST}"
          BACKUP_REF="${BACKUP_IMAGE%:*}@${BACKUP_DIGEST}"
          cosign sign --yes "$PRIMARY_REF"
          cosign sign --yes "$BACKUP_REF"
          cosign verify --certificate-identity "$COSIGN_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$PRIMARY_REF" >/dev/null
          cosign verify --certificate-identity "$COSIGN_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$BACKUP_REF" >/dev/null

      - name: Create final release tags from verified digests
        if: env.RECOVER_PUBLISHED_NPM != '1'
        run: |
          set -Eeuo pipefail
          docker buildx imagetools create --tag "$IMAGE" "${IMAGE%:*}@${DIGEST}"
          docker buildx imagetools create --tag "$BACKUP_IMAGE" "${BACKUP_IMAGE%:*}@${BACKUP_DIGEST}"

      - name: Verify both published container tags match the signed digests
        run: |
          set -Eeuo pipefail
          verify_tag_digest() {
            local image="$1" evidence="$2" platform_evidence="$3" repository expected actual manifest ANON_DOCKER_CONFIG
            repository="${image%:*}"
            expected="$(sed -n 's/^.*@\(sha256:[0-9a-f]\{64\}\)$/\1/p' "$evidence")"
            [[ -n "$expected" ]] || {
              echo "::error::Signed container evidence has an invalid digest: $evidence"
              exit 1
            }
            docker pull "$image"
            actual="$(docker image inspect "$image" --format '{{range .RepoDigests}}{{println .}}{{end}}' \
              | awk -F@ -v repository="$repository" '$1 == repository { print $2; exit }')"
            [[ "$actual" == "$expected" ]] || {
              echo "::error::$image resolves to ${actual:-no digest}; signed digest is $expected"
              exit 1
            }
            # A release image must be publicly consumable by both supported Linux
            # platforms without using the authenticated publishing credentials.
            ANON_DOCKER_CONFIG="$(mktemp -d)"
            manifest="$ANON_DOCKER_CONFIG/manifest.json"
            docker --config "$ANON_DOCKER_CONFIG" manifest inspect "${repository}@${expected}" > "$manifest"
            node -e '
              const fs=require("fs");
              const [manifestPath, output, reference]=process.argv.slice(1);
              const manifest=JSON.parse(fs.readFileSync(manifestPath,"utf8"));
              const descriptors=(manifest.manifests ?? []).map(({digest, mediaType, platform}) => ({ digest, mediaType, platform: `${platform?.os}/${platform?.architecture}` }));
              const platforms=descriptors.map(({platform}) => platform).sort();
              const requiredPlatforms={};
              for (const wanted of ["linux/amd64", "linux/arm64"]) {
                const matches=descriptors.filter(({platform}) => platform === wanted);
                if (matches.length !== 1 || !/^sha256:[0-9a-f]{64}$/.test(matches[0].digest)) {
                  throw new Error(`${reference} manifest list must contain exactly one immutable ${wanted} descriptor`);
                }
                requiredPlatforms[wanted]=matches[0].digest;
              }
              fs.writeFileSync(output, `${JSON.stringify({ reference, mediaType: manifest.mediaType, descriptors, platforms, requiredPlatforms }, null, 2)}\n`);
            ' "$manifest" "$platform_evidence" "${repository}@${expected}"
            for platform in linux/amd64 linux/arm64; do
              platform_digest="$(node -e '
                const evidence=require(process.argv[1]);
                const digest=evidence.requiredPlatforms?.[process.argv[2]];
                if (!/^sha256:[0-9a-f]{64}$/.test(digest ?? "")) process.exit(1);
                process.stdout.write(digest);
              ' "$PWD/$platform_evidence" "$platform")"
              # Pull each platform by its distinct child digest. Pulling the
              # shared index digest twice with different --platform values
              # makes Docker reject the second local ref as an overwrite.
              docker --config "$ANON_DOCKER_CONFIG" pull --platform "$platform" "${repository}@${platform_digest}" >/dev/null
            done
          }
          verify_tag_digest "$IMAGE" dist-release/assets/container-image.txt dist-release/assets/container-image-platforms.json
          verify_tag_digest "$BACKUP_IMAGE" dist-release/assets/backup-container-image.txt dist-release/assets/backup-container-image-platforms.json

      - name: Publish public npm packages with trusted provenance
        if: env.RECOVER_PUBLISHED_NPM != '1'
        env:
          NPM_CONFIG_PROVENANCE: "true"
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(node "$CLEARANCE_NPM_CLI" --version)" = "11.16.0"
          test "$(node "$CLEARANCE_NPM_CLI" config get registry)" = "https://registry.npmjs.org/"
          mapfile -t PACKAGES < <(node scripts/release-packages.mjs names)
          tarball_for() {
            node -e '
              const fs=require("fs"), cp=require("child_process"), path=require("path");
              const dir=process.argv[1], wanted=process.argv[2];
              const found=fs.readdirSync(dir).filter(f=>f.endsWith(".tgz")).find(f=>{
                try {
                  const p=JSON.parse(cp.execFileSync("tar",["-xzf",path.join(dir,f),"-O","package/package.json"],{encoding:"utf8",stdio:["ignore","pipe","ignore"]}));
                  return p.name===wanted;
                } catch { return false; }
              });
              if (!found) process.exit(1);
              process.stdout.write(path.join(dir,found));
            ' dist-release/assets "$1"
          }
          integrity_for() {
            node -e '
              const fs=require("fs"), crypto=require("crypto");
              process.stdout.write("sha512-"+crypto.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"));
            ' "$1"
          }
          registry_status_once() {
            local package="$1" encoded
            encoded="$(node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$package")"
            curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              "https://registry.npmjs.org/${encoded}/${VERSION}" || true
          }
          await_registry_status() {
            local package="$1" status
            for ATTEMPT in {1..120}; do
              status="$(registry_status_once "$package")"
              case "$status" in
                200) printf '%s' "$status"; return 0 ;;
                404)
                  # npm's negative cache can briefly hide an immutable version.
                  # Do not classify it absent until the full readback window ends.
                  if [[ "$ATTEMPT" -eq 120 ]]; then
                    printf '%s' "$status"
                    return 0
                  fi
                  echo "Waiting to confirm ${package}@${VERSION} is absent from the public registry (${ATTEMPT}/120)..." >&2
                  sleep 5
                  ;;
                000|429|5??)
                  echo "Waiting for a conclusive registry response for ${package}@${VERSION} (${ATTEMPT}/120)..." >&2
                  sleep 5
                  ;;
                *)
                  echo "::error::Registry returned HTTP $status for ${package}@${VERSION}" >&2
                  return 1
                  ;;
              esac
            done
            echo "::error::Registry did not return a conclusive response for ${package}@${VERSION}" >&2
            return 1
          }
          preflight_registry_statuses() {
            local STATUS_DIRECTORY STATUS PENDING INDEX
            STATUS_DIRECTORY="$(mktemp -d)"
            PREFLIGHT_STATUSES=()
            for INDEX in "${!PACKAGES[@]}"; do
              PREFLIGHT_STATUSES[$INDEX]=""
            done
            for ATTEMPT in {1..120}; do
              PIDS=()
              for INDEX in "${!PACKAGES[@]}"; do
                [[ -n "${PREFLIGHT_STATUSES[$INDEX]}" ]] && continue
                registry_status_once "${PACKAGES[$INDEX]}" > "$STATUS_DIRECTORY/$INDEX" &
                PIDS+=("$!")
              done
              for PID in "${PIDS[@]}"; do
                wait "$PID"
              done
              PENDING=0
              for INDEX in "${!PACKAGES[@]}"; do
                [[ -n "${PREFLIGHT_STATUSES[$INDEX]}" ]] && continue
                STATUS="$(< "$STATUS_DIRECTORY/$INDEX")"
                case "$STATUS" in
                  200) PREFLIGHT_STATUSES[$INDEX]="200" ;;
                  404)
                    # npm's negative cache can briefly hide an immutable version.
                    # Do not classify it absent until the shared readback window ends.
                    if [[ "$ATTEMPT" -eq 120 ]]; then
                      PREFLIGHT_STATUSES[$INDEX]="404"
                    else
                      PENDING=1
                    fi
                    ;;
                  000|429|5??|"") PENDING=1 ;;
                  *)
                    echo "::error::Registry returned HTTP $STATUS for ${PACKAGES[$INDEX]}@${VERSION}" >&2
                    return 1
                    ;;
                esac
              done
              [[ "$PENDING" -eq 0 ]] && return 0
              [[ "$ATTEMPT" -eq 120 ]] && break
              echo "Waiting for conclusive public-registry preflight across ${#PACKAGES[@]} packages (${ATTEMPT}/120)..." >&2
              sleep 5
            done
            echo "::error::Registry did not return a conclusive response within the shared ten-minute preflight window" >&2
            return 1
          }
          registry_integrity() {
            local package="$1" integrity=""
            for ATTEMPT in {1..120}; do
              if integrity="$(node "$CLEARANCE_NPM_CLI" view "${package}@${VERSION}" dist.integrity --json 2>/dev/null | tr -d '"\n')" \
                && [[ -n "$integrity" ]]; then
                printf '%s' "$integrity"
                return 0
              fi
              echo "Waiting for ${package}@${VERSION} to become readable from the public registry (${ATTEMPT}/120)..." >&2
              sleep 5
            done
            echo "::error::${package}@${VERSION} did not become readable from the public registry" >&2
            return 1
          }
          prepare_audit_tree() {
            local audit_dir="$1" package target
            shift
            mkdir -p "$audit_dir/node_modules"
            node -e '
              const fs = require("fs");
              const [output, version, ...packages] = process.argv.slice(1);
              const dependencies = Object.fromEntries(packages.map(name => [name, version]));
              fs.writeFileSync(output, `${JSON.stringify({ name: "clearance-provenance-audit", private: true, version: "0.0.0", dependencies }, null, 2)}\n`);
            ' "$audit_dir/package.json" "$VERSION" "$@"
            for package in "$@"; do
              target="$audit_dir/node_modules/$package"
              mkdir -p "$target"
              tar -xzf "$(tarball_for "$package")" -C "$target" --strip-components=1
            done
          }
          verify_provenance() {
            local output="$1"
            shift
            for ATTEMPT in {1..120}; do
              AUDIT_DIR="$(mktemp -d)"
              prepare_audit_tree "$AUDIT_DIR" "$@"
              if node "$CLEARANCE_NPM_CLI" audit signatures --prefix "$AUDIT_DIR" --json --include-attestations > "$AUDIT_DIR/npm-audit-signatures.json" \
                && node scripts/verify-npm-provenance.mjs \
                  "$VERSION" "$SOURCE_COMMIT" "$AUDIT_DIR/npm-audit-signatures.json" \
                  dist-release/assets "$output" "$@"; then
                return 0
              fi
              echo "Waiting for signed provenance for ${*} (${ATTEMPT}/120)..." >&2
              sleep 5
            done
            echo "::error::Signed npm provenance did not become verifiable within ten minutes" >&2
            return 1
          }
          EXISTING_PACKAGES=()
          ABSENT_PACKAGES=()
          preflight_registry_statuses
          for INDEX in "${!PACKAGES[@]}"; do
            PACKAGE="${PACKAGES[$INDEX]}"
            STATUS="${PREFLIGHT_STATUSES[$INDEX]}"
            if [[ "$STATUS" == "404" ]]; then
              ABSENT_PACKAGES+=("$PACKAGE")
              continue
            fi
            EXPECTED_INTEGRITY="$(integrity_for "$(tarball_for "$PACKAGE")")"
            PUBLISHED_INTEGRITY="$(registry_integrity "$PACKAGE")"
            [[ "$PUBLISHED_INTEGRITY" == "$EXPECTED_INTEGRITY" ]] || {
              echo "::error::${PACKAGE}@${VERSION} registry SHA-512 does not match the frozen local tarball"
              exit 1
            }
            EXISTING_PACKAGES+=("$PACKAGE")
          done
          if [[ "${#EXISTING_PACKAGES[@]}" -gt 0 ]]; then
            echo "Verify every existing immutable package before publishing any absent version: ${EXISTING_PACKAGES[*]}"
            verify_provenance dist-release/assets/npm-provenance-existing.json "${EXISTING_PACKAGES[@]}"
          fi
          for PACKAGE in "${ABSENT_PACKAGES[@]}"; do
            if ! node "$CLEARANCE_NPM_CLI" publish "$(tarball_for "$PACKAGE")" --access public --provenance; then
              # A competing immutable publish is acceptable only when the public
              # registry readback proves it is byte-for-byte the frozen artifact.
              [[ "$(await_registry_status "$PACKAGE")" == "200" ]] || exit 1
              EXPECTED_INTEGRITY="$(integrity_for "$(tarball_for "$PACKAGE")")"
              PUBLISHED_INTEGRITY="$(registry_integrity "$PACKAGE")"
              [[ "$PUBLISHED_INTEGRITY" == "$EXPECTED_INTEGRITY" ]] || {
                echo "::error::${PACKAGE}@${VERSION} publish conflict has different immutable bytes"
                exit 1
              }
            fi
          done
          for PACKAGE in "${PACKAGES[@]}"; do
            TARBALL="$(tarball_for "$PACKAGE")"
            EXPECTED_INTEGRITY="$(integrity_for "$TARBALL")"
            PUBLISHED_INTEGRITY="$(registry_integrity "$PACKAGE")"
            [[ "$PUBLISHED_INTEGRITY" == "$EXPECTED_INTEGRITY" ]] || {
              echo "::error::${PACKAGE}@${VERSION} failed final registry integrity verification"
              exit 1
            }
          done
          verify_provenance dist-release/assets/npm-provenance.json "${PACKAGES[@]}"

      - name: Prove anonymous public-registry install and imports
        if: env.RECOVER_PUBLISHED_NPM != '1'
        run: |
          set -Eeuo pipefail
          mapfile -t PACKAGES < <(node scripts/release-packages.mjs names)
          ANON_NPMRC="$(mktemp)"
          ANON_HOME="$(mktemp -d)"
          printf 'registry=https://registry.npmjs.org/\n' > "$ANON_NPMRC"
          INSTALL_DIR="$(mktemp -d)"
          env -u NODE_AUTH_TOKEN -u NPM_TOKEN HOME="$ANON_HOME" node "$CLEARANCE_NPM_CLI" --userconfig "$ANON_NPMRC" \
            install --prefix "$INSTALL_DIR" --ignore-scripts --save-exact "${PACKAGES[@]/%/@$VERSION}"
          CLI_ENTRY="$(INSTALL_DIR="$INSTALL_DIR" node --input-type=module <<'NODE'
          import { createRequire } from "node:module";
          import path from "node:path";
          const install = process.env.INSTALL_DIR;
          const require = createRequire(path.join(install, "package.json"));
          process.stdout.write(require.resolve("@clearance/cli"));
          NODE
          )"
          [[ -n "$CLI_ENTRY" ]]
          CLI_VERSION="$(env -u NODE_AUTH_TOKEN -u NPM_TOKEN HOME="$ANON_HOME" node "$CLI_ENTRY" --version)"
          [[ "$CLI_VERSION" == "$VERSION" ]] || {
            echo "::error::Anonymous @clearance/cli reported $CLI_VERSION, expected $VERSION"
            exit 1
          }
          env -u NODE_AUTH_TOKEN -u NPM_TOKEN HOME="$ANON_HOME" INSTALL_DIR="$INSTALL_DIR" node --input-type=module <<'NODE'
          import { createRequire } from "node:module";
          import path from "node:path";
          const install = process.env.INSTALL_DIR;
          const require = createRequire(path.join(install, "package.json"));
          for (const name of ["@clearance/management-client", "@clearance/observability-node", "@clearance/delivery", "@clearance/delivery-worker", "@clearance/key-management", "@clearance/verification", "@clearance/vault", "@clearance/auth", "@clearance/management", "@clearance/api"]) {
            await import(require.resolve(name));
          }
          const consolePackage = path.join(install, "node_modules", "@clearance", "console", "package.json");
          if (!require("node:fs").existsSync(consolePackage)) throw new Error("Anonymous registry install omitted @clearance/console.");
          NODE

      - name: Sign package and container-digest bundle
        env:
          CLEARANCE_RELEASE_ASSET_DIR: ${{ github.workspace }}/dist-release/assets
          CLEARANCE_REQUIRE_RELEASE_ASSETS: "1"
          CLEARANCE_REQUIRE_TAG_BINDING: "1"
          CLEARANCE_RELEASE_CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
          CLEARANCE_RELEASE_CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
          CLEARANCE_RELEASE_ALLOW_RECOVERY_IDENTITY: ${{ env.RECOVER_PUBLISHED_NPM }}
          CLEARANCE_VERSION: ${{ env.VERSION }}
        run: bash scripts/sign-release.sh "${{ github.workspace }}/dist-release"

      - name: Verify detached signature and asset manifest
        env:
          CLEARANCE_RELEASE_CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
          CLEARANCE_RELEASE_CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
          CLEARANCE_RELEASE_ALLOW_RECOVERY_IDENTITY: ${{ env.RECOVER_PUBLISHED_NPM }}
        run: |
          set -Eeuo pipefail
          bash scripts/verify-release-bundle.sh dist-release

      - name: Upload signed release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clearance-${{ env.VERSION }}-signed
          path: dist-release/
          if-no-files-found: error

      - name: Attach signed assets to tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || env.RECOVER_PUBLISHED_NPM == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          RELEASE_TAG="v${VERSION}"
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes
          mapfile -d '' FILES < <(find dist-release -type f -print0)
          test "${#FILES[@]}" -gt 0
          RELEASE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq .id)"
          EXISTING_ASSETS="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets")"
          declare -A NAMES=()
          for FILE in "${FILES[@]}"; do
            NAME="$(basename "$FILE")"
            [[ -z "${NAMES[$NAME]:-}" ]] || {
              echo "::error::Release bundle contains duplicate asset name $NAME"
              exit 1
            }
            NAMES[$NAME]=1
            mapfile -t MATCHES < <(jq -r --arg name "$NAME" '.[] | select(.name == $name) | [.id, (.digest // "")] | @tsv' <<<"$EXISTING_ASSETS")
            [[ "${#MATCHES[@]}" -le 1 ]] || {
              echo "::error::Release already contains duplicate asset name $NAME"
              exit 1
            }
            EXPECTED="sha256:$(sha256sum "$FILE" | awk '{print $1}')"
            if [[ "${#MATCHES[@]}" -eq 1 ]]; then
              IFS=$'\t' read -r _ ACTUAL <<<"${MATCHES[0]}"
              [[ "$ACTUAL" == "$EXPECTED" ]] || {
                echo "::error::Existing release asset $NAME has digest ${ACTUAL:-missing}; expected $EXPECTED"
                exit 1
              }
              echo "Existing release asset $NAME matches; skipping."
            else
              gh release upload "$RELEASE_TAG" "$FILE"
            fi
          done
