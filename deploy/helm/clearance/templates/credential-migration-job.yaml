{{- if or (eq .Values.credentialAuthority.phase "bootstrap") (eq .Values.credentialAuthority.phase "migrate") }}
{{- $apiRepository := required "image.repository is required" .Values.image.repository }}
{{- $apiDigest := required "image.digest is required; deploy an immutable release digest" .Values.image.digest }}
{{- $deploymentId := required "credentialAuthority.deploymentId is required" .Values.credentialAuthority.deploymentId }}
{{- $drainId := .Values.credentialAuthority.drainId }}
{{- if eq .Values.credentialAuthority.phase "bootstrap" }}
{{- $drainId = printf "bootstrap-%s-%s" .Release.Name $deploymentId }}
{{- else }}
{{- $drainId = required "credentialAuthority.drainId is required in migrate phase" $drainId }}
{{- end }}
{{- $attemptId := required "credentialAuthority.migrationAttemptId is required in migrate phase" .Values.credentialAuthority.migrationAttemptId }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-credential-migration-{{ printf "%s:%s" $drainId $attemptId | sha256sum | trunc 12 }}
  labels:
    app.kubernetes.io/name: clearance
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: credential-migrator
    clearance.dev/migration-attempt: {{ $attemptId | sha256sum | trunc 16 | quote }}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clearance
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: credential-migrator
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: credential-migrator
          image: "{{ $apiRepository }}@{{ $apiDigest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - node
            - packages/clearance-cli/dist/index.js
            - --json
            - --no-input
            - --yes
            - schema
            - migrate
            - --local
            - --drain-id
            - {{ $drainId | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: NODE_ENV
              value: production
            - name: CLEARANCE_STRICT_SECRETS
              value: "1"
            - name: CLEARANCE_CREDENTIAL_AUTHORITY_GENERATION
              value: digest-v1
            - name: CLEARANCE_DEPLOYMENT_ID
              value: {{ $deploymentId | quote }}
            - name: CLEARANCE_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: CLEARANCE_CREDENTIAL_DRAIN_ID
              value: {{ $drainId | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.existingSecret is required" .Values.secrets.existingSecret }}
                  key: database-url
            - name: CLEARANCE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: clearance-secret
            - name: CLEARANCE_BASE_URL
              value: {{ required "env.CLEARANCE_BASE_URL is required" .Values.env.CLEARANCE_BASE_URL | quote }}
{{- end }}
