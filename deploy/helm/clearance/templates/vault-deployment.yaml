{{- if .Values.vault.enabled }}
{{- $phase := required "credentialAuthority.phase is required" .Values.credentialAuthority.phase }}
{{- if not (has $phase (list "bootstrap" "bridge" "drain" "migrate" "serve")) }}{{ fail "credentialAuthority.phase must be bootstrap, bridge, drain, migrate, or serve" }}{{- end }}
{{- $vaultSecret := required "vault.secrets.existingSecret is required when vault.enabled" .Values.vault.secrets.existingSecret }}
{{- $vaultRepository := .Values.vault.image.repository | default .Values.image.repository }}
{{- $vaultDigest := .Values.vault.image.digest | default .Values.image.digest }}
{{- $vaultPullPolicy := .Values.vault.image.pullPolicy | default .Values.image.pullPolicy }}
{{- $vaultUrl := required "vault.publicUrl is required when vault.enabled" .Values.vault.publicUrl }}
{{- $projectId := required "vault.projectId is required when vault.enabled" .Values.vault.projectId }}
{{- $environmentId := required "vault.environmentId is required when vault.enabled" .Values.vault.environmentId }}
{{- if and .Values.productPresentation.customDomains.enabled (not (hasPrefix "https://" $vaultUrl)) }}{{ fail "vault.publicUrl must be canonical HTTPS when productPresentation.customDomains.enabled=true" }}{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-vault
  labels:
    app: clearance-vault
    app.kubernetes.io/name: clearance
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: vault
spec:
  replicas: {{ if eq $phase "serve" }}{{ .Values.vault.replicaCount }}{{ else }}0{{ end }}
  revisionHistoryLimit: {{ if eq $phase "serve" }}{{ .Values.revisionHistoryLimit }}{{ else }}0{{ end }}
  selector:
    matchLabels:
      app: clearance-vault
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        checksum/runtime-config: {{ printf "%s|%s|%s|%s|%s|%s|%s" $vaultSecret $vaultUrl $projectId $environmentId .Values.vault.restartToken .Values.restartToken $phase | sha256sum }}
      labels:
        app: clearance-vault
        app.kubernetes.io/name: clearance
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: vault
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vault
          image: "{{ $vaultRepository }}@{{ required "vault.image.digest or image.digest is required" $vaultDigest }}"
          imagePullPolicy: {{ $vaultPullPolicy }}
          command: ["node", "apps/vault-host/dist/server.js"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.vault.service.port }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
{{ toYaml .Values.vault.resources | indent 12 }}
          env:
            - name: CLEARANCE_VAULT_PORT
              value: {{ .Values.vault.service.port | quote }}
            - name: CLEARANCE_VAULT_URL
              value: {{ $vaultUrl | quote }}
            - name: CLEARANCE_BASE_URL
              value: {{ $vaultUrl | quote }}
            - name: CLEARANCE_VAULT_PRODUCT_NAME
              value: {{ .Values.vault.productName | quote }}
            - name: CLEARANCE_VAULT_HOME_LABEL
              value: {{ .Values.vault.homeLabel | quote }}
            - name: CLEARANCE_VAULT_ACCENT_COLOR
              value: {{ .Values.vault.accentColor | quote }}
            - name: CLEARANCE_CREDENTIAL_AUTHORITY_GENERATION
              value: digest-v1
            - name: CLEARANCE_DEPLOYMENT_ID
              value: {{ required "credentialAuthority.deploymentId is required when vault.enabled" .Values.credentialAuthority.deploymentId | quote }}
            - name: CLEARANCE_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: CLEARANCE_PROJECT_ID
              value: {{ $projectId | quote }}
            - name: CLEARANCE_ENV_ID
              value: {{ $environmentId | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $vaultSecret }}
                  key: database-url
            - name: CLEARANCE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $vaultSecret }}
                  key: clearance-secret
            - name: CLEARANCE_KEY_MANAGEMENT_CONFIG_JSON
              valueFrom:
                secretKeyRef:
                  name: {{ $vaultSecret }}
                  key: key-management-config-json
            - name: CLEARANCE_STRICT_SECRETS
              value: "1"
            - name: NODE_ENV
              value: production
{{- end }}
