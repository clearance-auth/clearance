{{- if .Values.delivery.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-delivery-worker
  labels:
    app: clearance-delivery-worker
    app.kubernetes.io/name: clearance
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: delivery-worker
spec:
  type: ClusterIP
  selector:
    app: clearance-delivery-worker
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: health
      port: {{ .Values.delivery.worker.healthPort }}
      targetPort: health
{{- end }}
