[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clearance-verification"
version = "0.3.0"
description = "Strict server-side verification for Clearance ES256 access tokens"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["cryptography>=45,<50"]

[tool.setuptools.packages.find]
where = ["src"]
